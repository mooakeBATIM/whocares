<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Cares? — демо</title>
<script>/* Тема выбирается до отрисовки страницы, чтобы не было вспышки света. */
(function () {
  var t = null;
  try { t = JSON.parse(localStorage.getItem('theme')); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = t;
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#191820' : '#f9f4e1');
})();
</script>
<style>:root{
  color-scheme:light;
  --bg:#f9f4e1;--bg-head:rgba(251,247,230,.9);--card:#fffcf1;--surface:#fff;--line:#e9e1c3;
  --lilac:#ede7fb;--lilac2:#ddd2f7;
  --tint:#f1eafd;--tint-line:#e3d8f8;--tint-hover:#e8ddfa;
  --sand:#f1e9cc;--sand2:#efe6c5;--sand3:#f5efd6;--strip:#f1ebcf;
  --violet:#6b3aa8;--violet-d:#4a2480;--on-accent:#fff;
  --ink:#2a1347;--head:#2a1247;--muted:#6b5a86;--quote:#6a4e92;--quote2:#4d3a6b;
  --warn:#a8512b;--ok:#2f7f62;
  --panel-lilac:linear-gradient(160deg,#f1ebfd,#e8dffa);--panel-lilac-line:#ddd2f7;
  --badge:linear-gradient(90deg,#e6dcfa,#f0e9fc);
  --mock:linear-gradient(160deg,#fffdf3,#f6f0da);--mock-line:#efe7ca;
  --tone0:linear-gradient(135deg,#e7ddfa,#d6c8f5);--tone1:linear-gradient(135deg,#f7efc9,#efe3a8);
  --tone2:linear-gradient(135deg,#efe6fb,#f6f0d4);--tone3:linear-gradient(135deg,#d9cdf6,#eee6fc);
  --scene:linear-gradient(135deg,#d9cdf6,#f4ecd0);
  --orb:radial-gradient(circle at 50% 50%,#fff 0 14%,#ddd2f7 15% 34%,#eee6fc 35% 56%,#f6f0d4 57% 100%);
  --feature-bg:linear-gradient(160deg,#5f2f9a,#3f1c70);--feature-ink:#fff;
  --foot-bg:linear-gradient(160deg,#4b2380,#33164f);--foot-ink:#e9defb;--foot-dim:#cdb9f5;
  --btn-shadow:0 12px 24px rgba(107,58,168,.30);
  --r:28px;--r-sm:18px;--shadow:0 10px 34px rgba(74,36,128,.10);--shadow-lg:0 24px 60px rgba(74,36,128,.16);
  --backdrop:rgba(42,19,71,.5);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#191820;--bg-head:rgba(25,24,32,.9);--card:#201f29;--surface:#23222d;--line:#34323f;
  --lilac:#2d2b37;--lilac2:#3b3846;
  --tint:#2a2833;--tint-line:#3a3744;--tint-hover:#34313f;
  --sand:#2a2833;--sand2:#2d2b37;--sand3:#23222d;--strip:#201f29;
  --violet:#d8a7b1;--violet-d:#ebc4cc;--on-accent:#191820;
  --ink:#f2edef;--head:#f6f1f3;--muted:#a8a2ae;--quote:#cdb2b9;--quote2:#cbc4cd;
  --warn:#e59b78;--ok:#7fcaa8;
  --panel-lilac:linear-gradient(160deg,#25232e,#2a2733);--panel-lilac-line:#3a3744;
  --badge:linear-gradient(90deg,#2d2b37,#34313f);
  --mock:linear-gradient(160deg,#23222d,#1e1d26);--mock-line:#34323f;
  --tone0:linear-gradient(135deg,#3a2f3c,#2e2834);--tone1:linear-gradient(135deg,#3d3436,#30282c);
  --tone2:linear-gradient(135deg,#2f2c3a,#38313a);--tone3:linear-gradient(135deg,#33303f,#2b2832);
  --scene:linear-gradient(135deg,#3a2f3c,#2a2833);
  --orb:radial-gradient(circle at 50% 50%,#2a2833 0 14%,#3a2f3c 15% 34%,#2b2833 35% 56%,#201f29 57% 100%);
  --feature-bg:linear-gradient(160deg,#d8a7b1,#b98593);--feature-ink:#191820;
  --foot-bg:linear-gradient(160deg,#121118,#0e0d13);--foot-ink:#d9d3db;--foot-dim:#d8a7b1;
  --btn-shadow:0 12px 24px rgba(216,167,177,.16);
  --shadow:0 10px 34px rgba(0,0,0,.35);--shadow-lg:0 24px 60px rgba(0,0,0,.45);
  --backdrop:rgba(10,9,14,.66);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:17px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;background:var(--bg);overflow-x:hidden}
a{color:var(--violet)}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:60}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle;line-height:0}

/* шапка */
.top{position:sticky;top:0;z-index:30;background:var(--bg-head);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
/* логотип-книга: белый фон картинки сливается с кремовой шапкой, в тёмной теме лежит на светлой плашке */
.logo-img{height:46px;width:auto;flex:0 0 auto;mix-blend-mode:multiply;display:block}
.logo-img.logo-tile,:root[data-theme="dark"] .logo-img{background:#fff;border-radius:12px;padding:4px 6px;mix-blend-mode:normal}
.bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bt b{font-size:1.35rem;color:var(--violet-d);letter-spacing:-.01em;white-space:nowrap}
.bt small{font-size:.62rem;letter-spacing:.06em;color:var(--violet);font-weight:600;white-space:nowrap}
nav{display:flex;align-items:center;gap:6px}
nav a{color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:12px;font-size:.98rem;font-weight:500;transition:background .2s,color .2s}
nav a:hover{background:var(--lilac)}nav a.on{color:var(--violet-d);font-weight:700;background:var(--lilac)}
.hicons{display:flex;align-items:center;gap:10px}
.ibtn{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;cursor:pointer;background:var(--sand);color:var(--ink);transition:transform .15s,background .2s}
.ibtn:hover{transform:translateY(-1px);background:var(--lilac2)}
.ibtn.solid{background:var(--violet);color:var(--on-accent)}.ibtn.solid:hover{background:var(--violet-d)}
.ibtn.sm{width:38px;height:38px;background:var(--lilac)}.ibtn.sm:disabled{opacity:.4}
.menu-btn{display:none}
@media (max-width:980px){
  .menu-btn{display:grid}
  nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:2px;background:var(--bg);padding:10px clamp(16px,4vw,32px) 16px;border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  nav a{padding:12px 14px;font-size:1.02rem}
  nav.open{display:flex}
}
@media (max-width:520px){
  .bar-in{height:64px;gap:8px}
  .hicons{gap:6px}
  .ibtn{width:40px;height:40px}
  .brand{gap:8px}
  .logo-img{height:38px}
  .bt b{font-size:1.1rem}
  .bt small{display:none}
}

main{max-width:1200px;margin:0 auto;padding:clamp(16px,3vw,36px) clamp(16px,4vw,32px) 70px;outline:none;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.12;margin:.2em 0 .4em;letter-spacing:-.02em;overflow-wrap:break-word}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em;overflow-wrap:break-word}
h3{margin:.2em 0 .3em;font-size:1.12rem}
.lead{color:var(--muted);font-size:1.15rem;max-width:42em}
.center{text-align:center}

/* кнопки, теги */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;background:var(--violet);color:var(--on-accent);font:inherit;font-weight:700;line-height:1.25;
  padding:15px 26px;border-radius:16px;text-decoration:none;box-shadow:var(--btn-shadow);transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:var(--violet-d)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.soft{background:var(--sand2);color:var(--ink);box-shadow:none}.btn.soft:hover{background:var(--lilac2)}
.btn.ghost{background:transparent;color:var(--violet);border:1.5px solid var(--violet);box-shadow:none}
.btn.ghost:hover{background:var(--lilac)}
.btn.sm{padding:8px 16px;font-size:.92rem;border-radius:12px;box-shadow:none}
.tag{display:inline-block;font-size:.76rem;font-weight:600;padding:3px 12px;border-radius:99px;background:var(--lilac);color:var(--violet-d);margin-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* секции-панели */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3.4vw,44px);margin:22px 0}
.panel.lilac{background:var(--panel-lilac);border-color:var(--panel-lilac-line)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.panel-head h2{margin:0}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .85fr;gap:clamp(24px,5vw,64px);align-items:center;padding:clamp(10px,3vw,40px) 0 10px}
.hero>*{min-width:0}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;line-height:1.3;padding:7px 18px;border-radius:99px;background:var(--badge);color:var(--violet-d);margin-bottom:22px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--violet);flex:none}
.hero h1{font-size:clamp(2.4rem,6.2vw,4.9rem);font-weight:800;line-height:1.02;letter-spacing:-.035em;margin:0 0 .35em;color:var(--head)}
.hero h1 em{font-style:normal;color:var(--violet)}
.hero p.sub{font-size:1.18rem;color:var(--muted);max-width:30em;margin:0 0 30px}
.hero p.tagline{font-size:clamp(1.15rem,2.4vw,1.5rem);line-height:1.35;color:var(--head);margin:0 0 18px;font-weight:600}
.hero p.tagline b{color:var(--violet);font-weight:800}
@media (max-width:520px){.hero .row .btn{flex:1 1 100%}}
.mock{background:var(--mock);border:1px solid var(--mock-line);border-radius:34px;padding:22px 26px 26px;box-shadow:var(--shadow-lg);animation:pop .6s ease}
@media (max-width:520px){.mock{padding:18px;border-radius:26px}}
.mock-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%}
.dots i:nth-child(1){background:#f08080}.dots i:nth-child(2){background:#f1c542}.dots i:nth-child(3){background:#5fd08a}
.mock-top code{font-size:.78rem;color:var(--violet)}
.thought{background:var(--surface);border:1px solid var(--tint-line);border-radius:20px;padding:18px 20px}
.thought b{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--violet-d)}
.thought q{font-style:italic;color:var(--quote);quotes:none;display:block;min-height:3.2em}
.thought button{margin-top:8px;display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--violet);cursor:pointer;font:inherit;font-size:.9rem;font-weight:600;padding:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.tile{display:flex;flex-direction:column;justify-content:flex-end;gap:12px;min-height:104px;background:var(--tint);border:1px solid var(--tint-line);border-radius:18px;padding:14px 16px;
  text-decoration:none;color:var(--ink);font-weight:700;font-size:.92rem;line-height:1.3;transition:transform .2s,background .2s}
.tile:hover{transform:translateY(-3px);background:var(--tint-hover)}
.tile .ico{color:var(--violet)}

/* полоса преимуществ */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px;border-radius:99px;background:var(--strip);margin:34px 0 0}
@media (max-width:820px){.strip{grid-template-columns:1fr;border-radius:var(--r);gap:10px}}
.feat{display:flex;align-items:center;gap:14px;padding:6px 14px}
.feat .av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--lilac2);display:grid;place-items:center;color:var(--violet-d)}
.feat b{display:block;font-size:.98rem;line-height:1.3}.feat small{color:var(--muted);font-size:.84rem;line-height:1.35;display:block}

/* вкладки, карусель */
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--sand3);border-radius:99px;padding:5px;width:fit-content;max-width:100%}
.tab{border:0;background:transparent;color:var(--ink);border-radius:99px;padding:8px 20px;cursor:pointer;font:inherit;font-weight:600;font-size:.92rem;transition:background .2s}
.tab[aria-selected=true]{background:var(--violet);color:var(--on-accent)}
@media (max-width:520px){
  .tabs{width:100%;border-radius:22px}
  .tab{flex:1 1 auto;text-align:center;padding:9px 14px}
  .arrows{display:none}
}
.arrows{display:flex;gap:8px}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.pcard{flex:0 0 min(300px,78%);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  text-decoration:none;color:var(--ink);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;animation:pop .4s ease}
a.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.pimg{height:150px;display:grid;place-items:center;color:var(--violet-d)}
.tone0{background:var(--tone0)}.tone1{background:var(--tone1)}.tone2{background:var(--tone2)}.tone3{background:var(--tone3)}
.pbody{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.pbody .tag{align-self:flex-start}.pbody h3{font-size:1.02rem;margin:.1em 0 .25em}.pbody p{margin:0 0 14px;color:var(--muted);font-size:.9rem;line-height:1.45;flex:1}
.pbtn{align-self:flex-end;background:var(--violet);color:var(--on-accent);font-weight:700;font-size:.85rem;padding:7px 16px;border-radius:99px}
.pcard.soon{opacity:.72}.pcard.soon .pbtn,.pcard.locked .pbtn{background:var(--lilac2);color:var(--violet-d)}

/* как начать */
.guide{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(20px,5vw,60px);align-items:center}
.guide>*{min-width:0}
@media (max-width:820px){.guide{grid-template-columns:1fr}}
.guide h2{font-size:clamp(1.8rem,4.4vw,3rem);font-weight:700}
.steps{border-left:3px solid var(--violet);padding-left:22px;display:grid;gap:20px}
.step b{display:block}.step span{color:var(--muted);font-size:.95rem}
.step a{font-size:.92rem;font-weight:600}

/* истории */
.story{display:grid;grid-template-columns:1fr 1.2fr;gap:22px;align-items:center}
.story>*{min-width:0}
@media (max-width:820px){.story{grid-template-columns:1fr}}
.scene{height:220px;border-radius:22px;background:var(--scene);display:grid;place-items:center;color:var(--violet-d)}
@media (max-width:820px){.scene{height:150px}}
.sbox{background:var(--surface);border-radius:20px;padding:22px 24px;border:1px solid var(--tint-line)}
.sbox>b{display:block}
.sbox q{display:block;quotes:none;font-style:italic;color:var(--quote2);margin:8px 0 14px}
.sbox .who{display:flex;align-items:center;gap:12px;font-weight:700}
.sbox .who i{width:40px;height:40px;flex:none;border-radius:50%;background:var(--lilac2);display:grid;place-items:center;font-style:normal;color:var(--violet-d)}
.sbox small{color:var(--muted);display:block;font-weight:400}

/* цифры */
.stats{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:clamp(16px,3vw,36px);align-items:center}
.stats>*{min-width:0}
@media (max-width:900px){.stats{grid-template-columns:1fr}.orb{max-height:200px}}
.num b{display:block;font-size:clamp(2.2rem,5vw,3.2rem);line-height:1;letter-spacing:-.03em;color:var(--violet-d)}
.num span{color:var(--muted);font-size:.95rem}
.nums{display:grid;gap:22px}
.orb{aspect-ratio:1;max-height:300px;width:100%;border-radius:28px;background:var(--orb);position:relative;overflow:hidden}
.orb::after{content:"";position:absolute;inset:30%;border-radius:50%;border:2px solid var(--violet);opacity:.4;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.7);opacity:.4}50%{transform:scale(1.5);opacity:1}}

/* три направления */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.svc{grid-template-columns:1fr}.svc a{min-height:190px!important}}
.svc a{display:flex;flex-direction:column;min-height:300px;padding:22px;border-radius:24px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .2s,box-shadow .2s}
.svc a:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.svc a.dark{background:var(--feature-bg);color:var(--feature-ink);border-color:transparent}
.svc .n{align-self:flex-end;font-size:1.5rem;font-weight:700;opacity:.8;line-height:1}
.svc h3{font-size:clamp(1.5rem,3vw,2rem);margin:auto 0 .4em;letter-spacing:-.01em}
.svc p{margin:0;font-size:.92rem;opacity:.85;min-height:4.9em}
@media (max-width:860px){.svc p{min-height:0}}

/* общие карточки и формы */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
a.card{display:block;text-decoration:none;color:var(--ink);transition:transform .2s}a.card:hover{transform:translateY(-3px)}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.card h3.hi{display:flex;align-items:center;gap:10px}.card h3.hi .ico{color:var(--violet)}
.notice{border-left:4px solid var(--warn);background:var(--card);padding:12px 16px;border-radius:12px;margin:14px 0}
.notice.ok{border-color:var(--ok)}
label{display:block;font-weight:600;margin:16px 0 6px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
input:focus,textarea:focus{border-color:var(--violet);outline:none}
textarea{min-height:90px;resize:vertical}
input[type=range]{padding:0;accent-color:var(--violet)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 16px;cursor:pointer;font:inherit}
.chip[aria-pressed=true]{background:var(--lilac);border-color:var(--violet);color:var(--violet-d);font-weight:600}
.entry{border-top:1px solid var(--line);padding:14px 0}.entry small{color:var(--muted)}
.article{max-width:42em}.article p{margin:.9em 0}
.article .box{background:var(--lilac);border-radius:16px;padding:14px 18px;margin:18px 0}
.crumbs{margin-bottom:14px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none}.back:hover{text-decoration:underline}
.big{font-size:2.4rem;font-weight:800;color:var(--violet);overflow-wrap:anywhere}
.err{color:var(--warn);min-height:1.4em;font-size:.95rem}
.results a{display:block;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink)}
.results a:hover,.results a:focus{background:var(--lilac)}.results small{color:var(--muted);display:block}

/* успокоиться */
.breath{width:min(260px,70vw);aspect-ratio:1;margin:26px auto;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:700;color:var(--violet-d);
  background:radial-gradient(circle,var(--surface),var(--lilac2));box-shadow:0 0 0 14px color-mix(in srgb,var(--violet) 12%,transparent);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.18)}.breath.out{transform:scale(.82);transition-duration:6s}

/* читалка */
.reader{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.reader{grid-template-columns:minmax(0,1fr)}.toc{display:none}.toc.open{display:block}}
.toc{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto;padding:14px}
@media (max-width:900px){.toc{position:static;max-height:none}}
.toc button{display:flex;align-items:center;gap:8px;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:.92rem;padding:9px 10px;border-radius:12px;cursor:pointer}
.toc button:hover{background:var(--lilac)}.toc button.cur{background:var(--lilac);color:var(--violet-d);font-weight:700}
.toc .lk{opacity:.7;display:inline-flex}
.bar{height:7px;background:var(--lilac2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--violet);width:0;transition:width .4s ease}
.rtools{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:6px;color:var(--muted);font-size:.9rem}
.rtools .row{gap:8px}
.sheet{padding:clamp(18px,4vw,42px);min-height:340px;font-family:Georgia,"Times New Roman",serif}
.sheet h2{margin-top:0;font-family:"Segoe UI",system-ui,sans-serif}
.sheet .txt{white-space:pre-wrap;overflow-wrap:break-word}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
@media (max-width:520px){.pager .btn{flex:1}}
.lock{text-align:center;max-width:34em;margin:0 auto;animation:fade .4s ease;font-family:"Segoe UI",system-ui,sans-serif}
.lock ul{text-align:left;display:inline-block;margin:10px 0 18px;padding-left:1.2em;color:var(--muted)}
.price{font-size:1.7rem;font-weight:800;color:var(--violet-d)}
.menu-toggle{display:none}@media (max-width:900px){.menu-toggle{display:inline-flex}}

dialog{border:0;border-radius:var(--r);padding:24px;width:min(460px,92vw);background:var(--card);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.4)}
dialog::backdrop{background:var(--backdrop);backdrop-filter:blur(3px)}

/* футер */
.foot{background:var(--foot-bg);color:var(--foot-ink);margin-top:30px}
.foot-in{display:flex;gap:30px;justify-content:space-between;flex-wrap:wrap;padding-top:34px;padding-bottom:40px}
.foot p{max-width:34em;font-size:.88rem;opacity:.85}
.foot .brand,.foot .bt b{color:#fff}.foot .bt small{color:var(--foot-dim)}
.foot .logo-img{background:#fff;border-radius:12px;padding:4px 6px;mix-blend-mode:normal}
.foot-links{display:grid;grid-template-columns:1fr 1fr;gap:8px 30px;align-content:start}
.foot-links a{color:var(--foot-ink);text-decoration:none;font-size:.95rem}.foot-links a:hover{text-decoration:underline}
@media (max-width:520px){.foot-in{padding-top:26px;padding-bottom:30px}.foot-links{width:100%}}
</style></head>

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

let calmTimer = null;
pages.calm = () => {
  const circle = h('div', { class: 'breath', role: 'status', 'aria-live': 'polite' }, 'Нажми «Начать»');
  let running = false;
  const btn = h('button', { class: 'btn' }, 'Начать');

    circle.className = 'breath ' + (inhale ? 'in' : 'out');
    circle.textContent = inhale ? 'Вдох… 4' : 'Выдох… 6';
  }
  btn.onclick = () => {
    if (running) { clearTimeout(calmTimer); running = false; circle.className = 'breath'; circle.textContent = 'Нажми «Начать»'; btn.textContent = 'Начать'; return; }
    running = true; btn.textContent = 'Остановить';
    const loop = (inhale) => { phase(inhale); calmTimer = setTimeout(() => loop(!inhale), inhale ? 4000 : 6000); };
    loop(true);
  };
  const senses = ['5 вещей, которые ты видишь', '4 вещи, которых можешь коснуться', '3 звука, которые слышишь', '2 запаха, которые чувствуешь', '1 вкус или одно спокойное слово про себя'];

      h('ul', {}, ['страх мешает ходить в школу, общаться или выходить из дома;', 'тревога или плохое настроение держатся давно и не проходят;', 'сильно страдают сон, аппетит, учёба;', 'есть мысли причинить себе вред — в этом случае нужно обратиться за помощью сразу.'].map((x) => h('li', {}, x)))),
    h('div', { class: 'panel lilac' }, h('h2', {}, 'Куда обратиться'),
      h('ul', {}, ['школьный психолог — самый близкий и часто бесплатный вариант;', 'поликлиника или центр психического здоровья по месту жительства;', 'частный психолог: проверяйте образование и подтверждённую квалификацию, спросите, работает ли он с подростками;', 'взрослый, которому ты доверяешь, поможет договориться о приёме.'].map((x) => h('li', {}, x)))),
    h('h2', {}, 'Телефоны доверия'),
    h('div', { class: 'grid' }, (cfg.data?.items || []).map((x) => h('div', { class: 'card' }, h('span', { class: 'tag' }, 'Помощь'), h('h3', {}, x.name), h('p', { class: 'big', style: 'margin:.2em 0' }, x.phone), h('p', {}, x.note)))),
    h('div', { class: 'notice' }, 'Если ты в опасности, немедленно позвони по номеру экстренной помощи в своей стране или обратись ко взрослому рядом.')];
};

pages.talk = async () => {
  const cfg = await api('/api/helplines');
  return [h('h1', {}, 'Мне нужно поговорить'),
    h('p', { class: 'lead' }, 'Если тебе тяжело, ты не обязан справляться один. Поговорить можно с тем, кому доверяешь: родителем, родственником, учителем, школьным психологом.'),
    h('div', { class: 'notice' }, 'Если есть мысли причинить себе вред или ты в опасности — сразу позвони по номеру экстренной помощи в своей стране или обратись ко взрослому рядом.'),
    h('div', { class: 'grid' }, (cfg.data?.items || []).map((x) => h('div', { class: 'card' }, h('span', { class: 'tag' }, 'Помощь'), h('h3', {}, x.name), h('p', { class: 'big', style: 'margin:.2em 0' }, x.phone), h('p', {}, x.note)))),
    h('div', { class: 'panel' }, h('h2', {}, 'Как начать разговор'), h('p', {}, 'Можно начать с одной фразы: «Мне сейчас непросто, и я хочу с тобой поговорить». Не нужно сразу всё объяснять.')),
    h('div', { class: 'notice' }, 'Этот сайт не заменяет консультацию специалиста и не гарантирует анонимность. Дневник и инструменты хранятся только на твоём устройстве.')];
};

pages.about = () => [h('h1', {}, 'О нас'),
  h('p', { class: 'lead' }, 'Who Cares — платформа без страха: безопасное пространство без осуждения для подростков, которым сложно из-за чужого мнения.'),
  h('div', { class: 'panel' }, h('h2', {}, 'Во что мы верим'),
    h('ul', {}, ['Ты не обязан нравиться всем, чтобы иметь право быть собой.', 'Чужое мнение может иметь значение, но не определяет твою ценность.', 'Страх осуждения — частая и понятная вещь, а не слабость.', 'Маленькие шаги важнее идеальных результатов.'].map((x) => h('li', {}, x)))),
  h('div', { class: 'panel lilac' }, h('h2', {}, 'Чего здесь нет'),
    h('ul', {}, ['Это не психологическая консультация и не лечение.', 'Мы не гарантируем анонимность: если ты создаёшь аккаунт для книги, мы храним твою почту.', 'Записи в дневнике и инструментах остаются в твоём браузере и нам не видны.'].map((x) => h('li', {}, x)))),
  h('p', {}, h('a', { class: 'btn', href: '#/book' }, 'Читать книгу'))];

/* ---------- читалка ---------- */
pages.book = async () => {
  const tocRes = await api('/api/book/toc');
  if (!tocRes.ok) return [h('p', {}, 'Книга временно недоступна.')];
  const toc = tocRes.data;
  const { total, freePages: FREE } = toc;
  const price = toc.price ? `${toc.price.toLocaleString('ru-RU')} ${toc.currency}` : 'Цена будет указана';
  let items = toc.items;
  let cur = 1, fs = store.get('book.fs', 19), lh = store.get('book.lh', 1.7);
  const sheet = h('div', { class: 'card sheet' });
  const prog = h('i'); const num = h('span'); const tocBox = h('div', { class: 'card toc', id: 'tocBox' });
  const prev = h('button', { class: 'btn ghost', onclick: () => go(cur - 1) }, ico('left', 18), 'Назад');
  const next = h('button', { class: 'btn', onclick: () => go(cur + 1) }, 'Дальше', ico('right', 18));
  const sheetTools = h('div', { class: 'rtools' }, num,
    h('div', { class: 'row' }, h('button', { class: 'btn ghost sm', 'aria-label': 'Уменьшить шрифт', onclick: () => setFs(fs - 1) }, 'A−'),
      h('button', { class: 'btn ghost sm', 'aria-label': 'Увеличить шрифт', onclick: () => setFs(fs + 1) }, 'A+'),
      h('button', { class: 'btn ghost sm', onclick: () => { lh = lh >= 1.9 ? 1.5 : lh + 0.2; store.set('book.lh', lh); applyType(); } }, 'Интервал'),
      h('button', { class: 'btn ghost sm menu-toggle', onclick: () => tocBox.classList.toggle('open') }, 'Содержание')));
  function setFs(v) { fs = Math.max(15, Math.min(28, v)); store.set('book.fs', fs); applyType(); }
  function applyType() { sheet.style.fontSize = fs + 'px'; sheet.style.lineHeight = String(lh); }

  function paintToc() {
    tocBox.replaceChildren(h('h3', { style: 'margin:0 0 8px' }, 'Содержание'),
      ...items.map((it) => h('button', { class: it.n === cur ? 'cur' : '', onclick: () => { tocBox.classList.remove('open'); go(it.n); } },
        h('span', {}, `${it.n}. ${it.title}`), it.locked && h('span', { class: 'lk', title: 'Платная страница' }, ico('lock', 16)))));
  }
  function lockScreen() {
    const buy = h('button', { class: 'btn', onclick: onBuy }, 'Открыть полную книгу');
    const msg = h('div', { role: 'status' });
    async function onBuy() {
      if (!me.user) return openAuth(() => onBuy());
      buy.disabled = true;
      const r = await api('/api/checkout', { body: {} });
      buy.disabled = false;
      if (r.ok && r.data.url) { location.href = r.data.url; return; }
      if (r.ok && r.data.alreadyPaid) { await refreshMe(); return reload(); }
      msg.replaceChildren(h('div', { class: 'notice' }, r.status === 503
        ? 'Оплата пока не подключена, поэтому открыть полную версию сейчас нельзя. Загляните позже.'
        : (r.data?.error || 'Не получилось начать оплату.')));
    }
    return h('div', { class: 'lock' }, h('h2', {}, 'Ты уже сделал первый шаг'),
      h('p', {}, 'Первые пять страниц были доступны бесплатно. Продолжи чтение, чтобы открыть всю книгу и познакомиться с остальными материалами.'),
      h('div', { class: 'price' }, price),
      h('div', {}, h('ul', {}, h('li', {}, `Полный текст книги — ${total} стр.`), h('li', {}, 'Доступ с любого устройства после входа в аккаунт'),
        h('li', {}, 'Закладка: книга запомнит, где ты остановился'))),
      h('div', { class: 'row', style: 'justify-content:center' }, buy, h('button', { class: 'btn ghost', onclick: () => go(FREE) }, 'Вернуться к прочитанным страницам')),
      me.user ? null : h('p', {}, h('small', {}, 'Для покупки нужен аккаунт: так доступ сохранится после повторного входа. ', h('a', { href: '#', onclick: (e) => { e.preventDefault(); openAuth(); } }, 'Войти'))),
      me.payments.configured ? null : h('p', {}, h('small', {}, 'Оплата пока не подключена.')), msg);
  }
  async function go(n) {
    cur = Math.max(1, Math.min(total, n));
    num.textContent = `Страница ${cur} из ${total}`;
    prog.style.width = `${(cur / total) * 100}%`;
    prev.disabled = cur === 1; next.disabled = cur === total;
    paintToc(); scrollTo({ top: 0, behavior: 'smooth' });
    const r = await api(`/api/book/page/${cur}`);
    if (r.status === 402) { sheet.replaceChildren(lockScreen()); next.disabled = true; return; }
    if (!r.ok) { sheet.replaceChildren(h('p', {}, 'Не удалось загрузить страницу.')); return; }
    sheet.replaceChildren(h('h2', {}, r.data.title), h('div', { class: 'txt' }, r.data.text));
    sheet.style.animation = 'none'; void sheet.offsetWidth; sheet.style.animation = '';
    store.set('book.last', cur);
    if (me.user) api('/api/progress', { body: { page: cur } });
  }
  async function reload() { const t = await api('/api/book/toc'); items = t.data.items; go(cur); }

  applyType();
  const saved = me.lastPage ?? store.get('book.last', 1);
  const start = Math.min(saved, me.hasAccess ? total : FREE);
  setTimeout(() => go(start), 0);
  return [h('h1', {}, `Книга «${toc.title}»`),
    h('p', { class: 'lead' }, `Первые ${FREE} страниц — бесплатно, без регистрации.`),
    h('div', { class: 'reader' }, tocBox, h('div', {}, sheetTools, h('div', { class: 'bar' }, prog), sheet, h('div', { class: 'pager' }, prev, next)))];
};

/* ---------- шапка и роутер ---------- */
const NAV = [['/', 'Главная'], ['/tools', 'Инструменты'], ['/book', 'Книга'], ['/stories', 'Истории'], ['/psychologists', 'Психологи'], ['/about', 'О нас']];
$('#nav').replaceChildren(...NAV.map(([p, t]) => h('a', { href: '#' + p }, t)));
$('#searchBtn').append(ico('search')); $('#accBtn').append(ico('user'));
$('#searchBtn').onclick = openSearch; $('#accBtn').onclick = openAccount;
const paintMenu = (open) => { $('#menuBtn').replaceChildren(ico(open ? 'close' : 'menu', 22)); $('#menuBtn').setAttribute('aria-expanded', String(open)); };
paintMenu(false);
$('#menuBtn').addEventListener('click', () => paintMenu($('#nav').classList.toggle('open')));

/* тема: выбор запоминается, по умолчанию берётся из настроек устройства */
function paintTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#themeBtn').replaceChildren(ico(dark ? 'sun' : 'moon', 20));
  $('#themeBtn').setAttribute('aria-label', dark ? 'Включить светлую тему' : 'Включить тёмную тему');
  $('#themeBtn').title = dark ? 'Светлая тема' : 'Тёмная тема';
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#191820' : '#f9f4e1');
}
$('#themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('theme', next); paintTheme();
};
paintTheme();
const SECTION = { fear: 'stories', article: 'stories', diary: 'tools', calm: 'tools', talk: 'psychologists' };

async function route() {
  clearTimeout(calmTimer);
  const hash = location.hash.replace(/^#/, '') || '/';
  const [, seg, arg] = hash.split('/');
  const key = seg || 'home';
  const view = pages[key];
  const active = '#/' + (SECTION[key] || seg || '');
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.getAttribute('href') === active));
  $('#nav').classList.remove('open'); paintMenu(false);
  main.replaceChildren(...[].concat(view ? await view(arg) : [h('p', {}, 'Такой страницы нет. '), h('a', { href: '#/' }, 'На главную')]));
  main.style.animation = 'none'; void main.offsetWidth; main.style.animation = '';
  if (key !== 'book') scrollTo(0, 0);
}
addEventListener('hashchange', route);
await refreshMe();
route();
</script></body></html>
